<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le grand jeu de l'accueil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Lora:wght@400;500&display=swap">
<style>
/* Charte CT : indigo pour la structure, menthe pour les accents, sable pour les encadrés, rose poudré pour la mise en valeur */
:root{
  --bg:#FAF8F5; --surface:#FFFFFF; --ink:#222222; --muted:#666666; --line:#D9D9D9;
  --indigo:#2F3E75; --menthe:#A8D5C2; --sable:#E8DCC8; --rose:#E7C7C8;
  --ok:#2E7D5B; --okbg:#E3F2EA; --ko:#A33A3A; --kobg:#F6E3E3;
  --display:"Montserrat","Poppins",system-ui,sans-serif; --body:"Lora",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141826; --surface:#1C2133; --ink:#ECEAE6; --muted:#A8A9B3; --line:#33394F;
  --indigo:#A9B6EA; --menthe:#5E9C83; --sable:#3A3428; --rose:#5A3E40;
  --ok:#7FD0A8; --okbg:#1C3A2D; --ko:#F09A9A; --kobg:#3F2224; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141826; --surface:#1C2133; --ink:#ECEAE6; --muted:#A8A9B3; --line:#33394F;
  --indigo:#A9B6EA; --menthe:#5E9C83; --sable:#3A3428; --rose:#5A3E40;
  --ok:#7FD0A8; --okbg:#1C3A2D; --ko:#F09A9A; --kobg:#3F2224; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,.btn,.tag,.score{font-family:var(--display)}
h1{font-size:1.6rem;color:var(--indigo);margin:0;text-wrap:balance}
h2{font-size:1.15rem;color:var(--indigo);margin:0;text-wrap:balance}
.eyebrow{font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--menthe);padding-bottom:12px}
.score{font-size:1rem;color:var(--indigo);font-variant-numeric:tabular-nums;background:var(--sable);padding:6px 12px;border-radius:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.situation{background:var(--sable);border-radius:8px;padding:12px 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.95rem;font-weight:500;text-align:left;padding:12px 14px;border-radius:8px;cursor:pointer;line-height:1.4}
.btn:hover:not(:disabled){border-color:var(--indigo)}
.btn:focus-visible{outline:3px solid var(--menthe);outline-offset:2px}
.btn.good{border-color:var(--ok);background:var(--okbg)}
.btn.bad{border-color:var(--ko);background:var(--kobg)}
.btn:disabled{cursor:default}
.primary{background:var(--indigo);color:var(--bg);border-color:var(--indigo);font-weight:600;text-align:center}
.primary:hover:not(:disabled){filter:brightness(1.1)}
.vf{flex-direction:row}.vf .btn{flex:1;text-align:center;font-weight:600}
.expl{border-left:4px solid var(--menthe);padding:8px 12px;background:var(--bg);border-radius:0 6px 6px 0}
.expl b{font-family:var(--display)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--indigo);transition:width .3s}
.manches{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.manche{display:flex;flex-direction:column;gap:2px}
.manche small{color:var(--muted);font-family:var(--body);font-weight:400}
.order-picked{display:flex;flex-direction:column;gap:6px;min-height:20px}
.order-picked div{font-family:var(--display);font-size:.9rem;background:var(--sable);padding:8px 10px;border-radius:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-family:var(--display);color:var(--indigo)}
.big{font-family:var(--display);font-size:2.4rem;color:var(--indigo);font-weight:700;font-variant-numeric:tabular-nums}
input[type=text]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const M=[
{id:"vf",titre:"Vrai ou faux",pts:10,sous:"8 affirmations sur l'accueil",q:[
 {t:"vf",s:"Une patiente arrive au comptoir pendant que vous êtes au téléphone. Vous terminez votre appel avant de lui montrer que vous l'avez vue, pour ne pas couper votre interlocuteur.",a:false,e:"Un regard, un sourire ou un signe de la main dès son arrivée : elle sait qu'elle est vue et patiente beaucoup plus sereinement. Ensuite seulement on termine l'appel."},
 {t:"vf",s:"Pour un patient connu du cabinet depuis dix ans, la vérification d'identité n'est plus nécessaire.",a:false,e:"L'identitovigilance s'applique à chaque venue : homonymes, dossiers fusionnés, erreur de saisie… L'habitude est justement ce qui crée les erreurs."},
 {t:"vf",s:"Au téléphone, on se présente avant que l'appelant ne parle : nom du cabinet, son prénom, formule de politesse.",a:true,e:"L'appelant sait immédiatement qu'il est au bon endroit et à qui il parle. « Cabinet Les Flamboyants, Nancy, bonjour. »"},
 {t:"vf",s:"Une femme appelle pour savoir si son mari est bien venu en consultation hier. Comme ils sont mariés, vous pouvez lui confirmer.",a:false,e:"Le mariage ne lève pas le secret professionnel. On ne confirme ni n'infirme la venue d'un patient ; on l'invite à en parler directement avec son mari."},
 {t:"vf",s:"« Je vais voir ce que je peux faire » est une formule rassurante à privilégier.",a:false,e:"Elle est vague et n'engage à rien. Mieux vaut annoncer l'action concrète : « Je vérifie l'agenda du Dr Anator et je vous propose deux créneaux. »"},
 {t:"vf",s:"Le sourire s'entend au téléphone.",a:true,e:"Il modifie la voix : intonation plus chaleureuse, débit plus posé. C'est la première chose que l'appelant perçoit."},
 {t:"vf",s:"Face à un patient énervé, il faut d'abord lui expliquer clairement qu'il a tort, pour recadrer l'échange.",a:false,e:"On écoute d'abord, on reformule son ressenti et sa demande. Tant qu'il ne se sent pas entendu, aucune explication ne passe."},
 {t:"vf",s:"Un bon accueil fait gagner du temps au médecin.",a:true,e:"Demande bien analysée, identité vérifiée, documents prêts, patient apaisé et bien orienté : la consultation démarre directement sur l'essentiel."}
]},
{id:"qcm",titre:"Que faites-vous ?",pts:20,sous:"8 situations au comptoir et au téléphone",q:[
 {s:"Mme Ricou, troisième dans la file, vous dit en arrivant au comptoir : « J'ai un peu mal à la poitrine depuis ce matin, mais ce n'est rien, j'attends mon tour. »",o:["Vous l'inscrivez en priorité sur la liste d'attente","Vous la faites asseoir et prévenez immédiatement le médecin","Vous lui demandez de décrire la douleur pour la noter dans son dossier","Vous lui conseillez de se rendre aux urgences"],a:1,e:"Une douleur thoracique est une urgence potentielle, même minimisée par la patiente. On ne la laisse pas attendre et on n'évalue pas soi-même : on alerte le médecin tout de suite (le 15 s'il n'y a pas de médecin sur place)."},
 {s:"Au comptoir, devant la salle d'attente, un patient vous demande si ses résultats de prise de sang sont arrivés.",o:["Vous vérifiez et lui lisez les valeurs à voix basse","Vous lui répondez que les résultats ne se donnent jamais à l'accueil","Vous vérifiez, lui confirmez discrètement qu'ils sont arrivés et que le médecin les lui commentera","Vous lui imprimez les résultats pour qu'il les lise en salle d'attente"],a:2,e:"La SAMA peut dire si les résultats sont arrivés, discrètement. L'interprétation et la communication des valeurs reviennent au médecin."},
 {s:"Le téléphone sonne alors que vous enregistrez un patient au comptoir.",o:["Vous laissez sonner, le répondeur prendra le message","Vous vous excusez auprès du patient, décrochez, présentez le cabinet et demandez à l'appelant s'il peut patienter","Vous décrochez et dites « Ne quittez pas » avant de revenir au patient","Vous prenez l'appel jusqu'au bout puis revenez au patient"],a:1,e:"On prévient le patient présent, on décroche, on se présente et on demande l'accord de l'appelant pour patienter, en vérifiant au passage qu'il ne s'agit pas d'une urgence."},
 {s:"Mme Belfort arrive avec son fils de 15 ans pour un certificat de sport. C'est le fils qui consulte.",o:["Vous vous adressez uniquement à la mère, responsable légale","Vous vous adressez au fils et vérifiez son identité, en associant la mère","Vous demandez au fils de revenir avec un rendez-vous à son nom","Vous vous adressez au fils seul, il est assez grand"],a:1,e:"Le patient, c'est l'adolescent : on s'adresse à lui et on vérifie son identité (carnet de santé, carte Vitale du parent), en associant la mère, présente comme représentante légale."},
 {s:"M. Lambert se présente sans rendez-vous : « Je voulais juste une ordonnance. »",o:["Vous lui expliquez que le médecin ne fait pas d'ordonnance sans consultation","Vous lui donnez le premier rendez-vous disponible","Vous lui demandez de quel traitement il s'agit et quand il a vu le médecin pour la dernière fois, puis transmettez","Vous déposez sa demande et lui dites de repasser demain"],a:2,e:"Avant de répondre, on questionne : quel traitement, depuis quand, quand se termine-t-il, quand a eu lieu la dernière consultation. La réponse dépend du médecin, pas de la SAMA."},
 {s:"Un coursier dépose une enveloppe marquée « Confidentiel » au nom du Dr Kancel.",o:["Vous l'ouvrez pour la classer dans le bon dossier patient","Vous signez le bordereau et la remettez fermée au Dr Kancel","Vous refusez le pli, le médecin n'est pas là","Vous l'ouvrez et la scannez pour gagner du temps"],a:1,e:"Un pli « Personnel » ou « Confidentiel » ne s'ouvre jamais : on le remet fermé à son destinataire."},
 {s:"La salle d'attente est pleine, le Dr Anator a environ 40 minutes de retard. Un patient vous demande : « C'est encore long ? »",o:["« Il reste deux patients avant vous. »","« Le docteur a environ 40 minutes de retard. Si vous préférez, je peux vous proposer un autre créneau. »","« Je ne sais pas, il est en consultation. »","« Ce ne sera plus très long, monsieur. »"],a:1,e:"On informe honnêtement et précisément, puis on propose une alternative. Une réponse vague ou rassurante à tort se retourne contre le cabinet au bout de dix minutes."},
 {s:"Mme Démosthène, malentendante, arrive avec sa fille, qui répond à toutes les questions à sa place.",o:["Vous continuez avec la fille, c'est plus rapide","Vous demandez à la fille de laisser parler sa mère","Vous vous placez face à Mme Démosthène, articulez et proposez l'écrit si besoin","Vous parlez plus fort à Mme Démosthène"],a:2,e:"On s'adresse à la patiente : face à elle, en articulant, sans crier, avec l'écrit si nécessaire. La fille reste associée sans être exclue."}
]},
{id:"formule",titre:"La bonne formule",pts:15,sous:"6 moments, choisir la phrase la plus professionnelle",q:[
 {s:"Vous êtes disponible. Un patient s'approche du comptoir.",o:["« Oui ? »","« Bonjour monsieur, c'est pour quoi ? »","« Bonjour monsieur, je vous écoute. »","« Bonjour, vous avez rendez-vous ? »"],a:2,e:"On salue et on ouvre l'échange sans orienter. « Vous avez rendez-vous ? » ferme la porte à toute autre demande."},
 {s:"Vous devez faire patienter un appelant pour vérifier l'agenda.",o:["« Ne quittez pas. »","« Je vérifie l'agenda, cela prend une minute environ. Vous pouvez patienter ? »","« Attendez, je regarde. »","« Un instant s'il vous plaît. »"],a:1,e:"On dit pourquoi, combien de temps, et on demande l'accord."},
 {s:"M. Lambert vient de vous expliquer qu'il part le 12 et n'aura plus de traitement.",o:["« D'accord, je note. »","« Vous voulez un rendez-vous, c'est ça ? »","« Si je comprends bien, vous avez besoin du renouvellement de votre traitement avant votre départ du 12, c'est bien cela ? »","« Il faut prendre rendez-vous, monsieur. »"],a:2,e:"La reformulation reprend le besoin réel et la contrainte, puis vérifie. « Un rendez-vous » n'est que la solution, pas la demande."},
 {s:"Le mardi demandé est complet.",o:["« Ce n'est pas possible mardi. »","« Mardi c'est complet, rappelez la semaine prochaine. »","« Le docteur n'a plus de place mardi. Je peux vous proposer jeudi 9h ou vendredi 14h, lequel vous arrange ? »","« Désolée, le docteur est surbooké. »"],a:2,e:"On annonce la contrainte sans s'excuser à l'excès et on propose immédiatement deux alternatives concrètes."},
 {s:"Un patient s'agace de l'attente et hausse le ton.",o:["« Calmez-vous, monsieur. »","« Ce n'est pas de ma faute, monsieur. »","« Je comprends que cette attente soit pénible, monsieur. Je regarde avec vous ce qui est possible maintenant. »","« Tout le monde attend, monsieur. »"],a:2,e:"On reconnaît le ressenti, puis on passe à l'action. « Calmez-vous » produit presque toujours l'effet inverse."},
 {s:"Le rendez-vous est fixé, le patient va partir.",o:["« Au revoir, bonne journée. »","« C'est noté, à jeudi. »","« Je vous ai noté jeudi 9h avec le Dr Silvestre, pensez à votre carte Vitale. Bonne journée, monsieur. »","« Voilà, c'est bon. »"],a:2,e:"La prise de congé récapitule (jour, heure, médecin, documents) : c'est la dernière impression, et elle évite les erreurs."}
]},
{id:"ordre",titre:"Dans l'ordre",pts:30,sous:"Reconstituer la procédure d'accueil physique",q:[
 {t:"ordre",s:"Touchez les étapes dans l'ordre où vous les réalisez au comptoir.",steps:["Saluer, regarder, se rendre disponible","Identifier le patient","Écouter et questionner pour comprendre la demande","Reformuler pour vérifier","Répondre, renseigner ou orienter","Vérifier la compréhension et prendre congé"],e:"Saluer → identifier → questionner → reformuler → répondre ou orienter → vérifier et prendre congé. La confidentialité au comptoir s'applique à chaque étape."}
]},
{id:"identito",titre:"Identitovigilance",pts:20,sous:"4 questions sur l'identité du patient",q:[
 {s:"Lequel de ces éléments est un trait d'identité strict ?",o:["Le nom d'usage","Le numéro de téléphone","Le nom de naissance","L'adresse"],a:2,e:"Les traits stricts : nom de naissance, premier prénom de naissance, date de naissance, sexe, lieu de naissance. Le nom d'usage est un trait complémentaire."},
 {s:"Mme Laure Petit-Jean, mariée, est née Dorval. Sous quel nom recherchez-vous son dossier ?",o:["Petit-Jean","Dorval","Les deux indifféremment","Celui qu'elle donne en premier"],a:1,e:"La recherche se fait sur le nom de naissance. Le nom d'usage est ensuite vérifié comme trait complémentaire."},
 {s:"Laquelle de ces questions est la plus sûre pour vérifier l'identité ?",o:["« Vous êtes bien Mme Dorval ? »","« Vous êtes née le 12 mars, c'est ça ? »","« Pouvez-vous me donner votre nom de naissance, votre prénom et votre date de naissance ? »","« C'est bien vous sur la carte Vitale ? »"],a:2,e:"Question ouverte : c'est le patient qui donne l'information. À « Vous êtes bien… ? », beaucoup répondent oui sans écouter."},
 {s:"Dans le logiciel, deux dossiers « Marie-Line Jacques » : nées le 12/03/1958 et le 21/03/1958. La patiente vous dit « C'est moi, la plus âgée ».",o:["Vous ouvrez le dossier du 12/03","Vous lui demandez sa date de naissance complète et la vérifiez avec une pièce d'identité","Vous ouvrez les deux dossiers pour comparer les adresses","Vous lui demandez son médecin traitant"],a:1,e:"Face à des homonymes, on fait donner la date complète par la patiente et on contrôle avec une pièce d'identité. On ne choisit jamais un dossier à partir d'une déduction."}
]}
];

let S={name:"",m:null,i:0,scores:{},answered:false,picked:[],log:{}};
try{const n=localStorage.getItem("qa_name");if(n)S.name=n}catch(e){}
const app=document.getElementById("app");
const total=()=>Object.values(S.scores).reduce((a,b)=>a+b,0);
const max=M.reduce((a,m)=>a+m.pts*(m.id==="ordre"?1:m.q.length),0);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function header(sub){return `<div class="top"><div><div class="eyebrow">SAMA · Accueillir, renseigner et orienter un patient</div><h1>Le grand jeu de l'accueil</h1>${sub?`<div class="eyebrow" style="margin-top:4px">${sub}</div>`:""}</div><div class="score">${total()} / ${max} pts</div></div>`}

function home(){
 app.innerHTML=header(S.name?esc(S.name):"")+`
 <div class="card"><label for="nm" class="eyebrow">Votre prénom</label><input type="text" id="nm" value="${esc(S.name)}" placeholder="Prénom">
 <p style="margin:0;color:var(--muted)">Cinq manches. Répondez seule, sans aide. Après chaque réponse, lisez l'explication avant de passer à la suite.</p></div>
 <div class="manches">${M.map(m=>{const done=m.id in S.scores;const mx=m.id==="ordre"?m.pts:m.pts*m.q.length;return `<button class="btn manche" data-m="${m.id}"><span>${m.titre}${done?` · ${S.scores[m.id]}/${mx}`:""}</span><small>${m.sous} · ${mx} pts</small></button>`}).join("")}</div>
 ${Object.keys(S.scores).length===M.length?`<button class="btn primary" id="fin">Voir mon résultat</button>`:""}`;
 const nm=document.getElementById("nm");nm.oninput=()=>{S.name=nm.value;try{localStorage.setItem("qa_name",nm.value)}catch(e){}};
 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.m=M.find(x=>x.id===b.dataset.m);S.i=0;S.scores[S.m.id]=0;S.log[S.m.id]=[];S.picked=[];render()});
 const f=document.getElementById("fin");if(f)f.onclick=fin;
}

function render(){
 const m=S.m,q=m.q[S.i];S.answered=false;
 const pct=Math.round(S.i/m.q.length*100);
 let body="";
 if(q.t==="vf") body=`<div class="opts vf"><button class="btn" data-v="1">Vrai</button><button class="btn" data-v="0">Faux</button></div>`;
 else if(q.t==="ordre"){q._sh=q._sh||shuffle(q.steps);S.picked=[];body=`<div class="order-picked" id="pk"></div><div class="opts" id="pool">${q._sh.map(s=>`<button class="btn" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>`}
 else{q._o=shuffle(q.o.map((t,k)=>({t,k})));body=`<div class="opts">${q._o.map(o=>`<button class="btn" data-k="${o.k}">${esc(o.t)}</button>`).join("")}</div>`}
 app.innerHTML=header(`${m.titre} · question ${S.i+1} sur ${m.q.length}`)+`<div class="progress"><span style="width:${pct}%"></span></div>
 <div class="card"><div class="situation">${esc(q.s)}</div>${body}<div id="fb"></div></div>
 <div class="row"><button class="btn" id="back">Retour aux manches</button></div>`;
 document.getElementById("back").onclick=home;
 if(q.t==="vf") app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>answer(b,(b.dataset.v==="1")===q.a,app.querySelector(`[data-v="${q.a?1:0}"]`)));
 else if(q.t==="ordre") app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{b.disabled=true;b.hidden=true;S.picked.push(b.dataset.s);document.getElementById("pk").innerHTML=S.picked.map((s,k)=>`<div>${k+1}. ${esc(s)}</div>`).join("");if(S.picked.length===q.steps.length)finishOrder(q)});
 else app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>answer(b,+b.dataset.k===q.a,app.querySelector(`[data-k="${q.a}"]`)));
}

function answer(btn,ok,goodBtn){
 if(S.answered)return;S.answered=true;
 app.querySelectorAll(".opts .btn").forEach(b=>b.disabled=true);
 goodBtn.classList.add("good");if(!ok)btn.classList.add("bad");
 if(ok)S.scores[S.m.id]+=S.m.pts;
 S.log[S.m.id].push({ok,s:S.m.q[S.i].s});
 feedback(ok,S.m.q[S.i].e);
}
function finishOrder(q){
 const correct=S.picked.filter((s,k)=>s===q.steps[k]).length;
 const ok=correct===q.steps.length;
 const pts=Math.round(S.m.pts*correct/q.steps.length);S.scores[S.m.id]=pts;S.log[S.m.id]=[{ok,s:"Procédure d'accueil : "+correct+"/"+q.steps.length+" étapes bien placées"}];
 document.getElementById("pk").innerHTML=S.picked.map((s,k)=>`<div style="background:${s===q.steps[k]?"var(--okbg)":"var(--kobg)"}">${k+1}. ${esc(s)}</div>`).join("");
 feedback(ok,`${correct} étape${correct>1?"s":""} sur ${q.steps.length} à la bonne place (${pts} pts). ${q.e}`);
}
function feedback(ok,e){
 const last=S.i===S.m.q.length-1;
 document.getElementById("fb").innerHTML=`<div class="expl"><b style="color:${ok?"var(--ok)":"var(--ko)"}">${ok?"Bonne réponse":"Pas tout à fait"}</b><br>${esc(e)}</div><button class="btn primary" id="nx" style="margin-top:12px">${last?"Terminer la manche":"Question suivante"}</button>`;
 document.getElementById("nx").onclick=()=>{if(last)home();else{S.i++;render()}};
 document.getElementById("nx").focus();
}
const niveau=p=>p>=80?["Acquis","var(--ok)"]:p>=50?["En cours","var(--indigo)"]:["À revoir","var(--ko)"];
function bilanTexte(){
 const d=new Date().toLocaleDateString("fr-FR");
 let t=`Grand jeu de l'accueil — ${S.name||"(prénom non saisi)"} — ${d}\nScore : ${total()} / ${max}\n`;
 M.forEach(m=>{const mx=m.id==="ordre"?m.pts:m.pts*m.q.length;const sc=S.scores[m.id]??0;t+=`\n${m.titre} : ${sc}/${mx} (${niveau(Math.round(sc/mx*100))[0]})`;
  (S.log[m.id]||[]).filter(x=>!x.ok).forEach(x=>{t+=`\n  ✗ ${x.s.length>90?x.s.slice(0,90)+"…":x.s}`})});
 return t;
}
function fin(){
 const rows=M.map(m=>{const mx=m.id==="ordre"?m.pts:m.pts*m.q.length;const sc=S.scores[m.id]??0;const [lv,c]=niveau(Math.round(sc/mx*100));return `<tr><td>${m.titre}<br><small style="color:${c};font-family:var(--display);font-weight:600">${lv}</small></td><td>${sc} / ${mx}</td></tr>`}).join("");
 app.innerHTML=header(S.name?esc(S.name):"")+`<div class="card" style="align-items:center;text-align:center"><div class="eyebrow">Score total</div><div class="big">${total()} / ${max}</div><p style="margin:0;color:var(--muted)">Copiez votre bilan et envoyez-le à votre formatrice.</p></div>
 <div class="card"><table>${rows}</table></div>
 <div class="card"><div class="eyebrow">Mon bilan à envoyer</div><textarea id="bt" readonly rows="10" style="font:inherit;font-size:.85rem;width:100%;box-sizing:border-box;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">${esc(bilanTexte())}</textarea><button class="btn primary" id="cp">Copier mon bilan</button><div id="cpm" class="eyebrow"></div></div>
 <div class="row"><button class="btn" id="back">Retour aux manches</button><button class="btn" id="reset">Recommencer à zéro</button></div>`;
 document.getElementById("cp").onclick=()=>{const ta=document.getElementById("bt");const done=()=>document.getElementById("cpm").textContent="Bilan copié. Collez-le dans le message à votre formatrice.";
  if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.select();document.getElementById("cpm").textContent="Le texte est sélectionné : faites Copier."});else{ta.select();document.getElementById("cpm").textContent="Le texte est sélectionné : faites Copier."}};
 document.getElementById("back").onclick=home;
 document.getElementById("reset").onclick=()=>{S.scores={};S.log={};M.forEach(m=>m.q.forEach(q=>delete q._sh));home()};
}
home();
</script>
